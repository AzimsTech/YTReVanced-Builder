name: Build

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Which variant(s) to build
        type: choice
        options:
          - all
          - revanced
          - morphe
        default: all
  schedule:
    - cron: '11 11 * * *'  # Daily build at 7:11 PM MYT (11:11 UTC)

permissions:
  contents: write

env:
  JAVA_VERSION: 21
  JAVA_DISTRIBUTION: 'zulu'
  ARCH: 'universal'
  DOWNLOADS_DIR: 'downloads'
  TIMEZONE: 'Asia/Kuala_Lumpur'

jobs:
  # Decides which variant(s) actually need building:
  #  - manual dispatch: always build the requested variant(s)
  #  - schedule: only variants whose upstream patches version changed
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Fetch all history including tags

      - name: Make scripts executable
        run: chmod +x *.sh

      - name: Determine variants to build
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VARIANT: ${{ github.event.inputs.variant }}
        run: |
          selected=()

          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "$INPUT_VARIANT" in
              revanced) selected+=(revanced) ;;
              morphe)   selected+=(morphe) ;;
              *)        selected+=(revanced morphe) ;;
            esac
          else
            for v in revanced morphe; do
              . "variants/$v.env"
              latest=$(VARIANT="$v" ./"$PATCHES_SCRIPT" --version-only || true)
              current=$(git tag -l "*-${TAG_SUFFIX}" --sort=-version:refname | head -n1 || true)
              current="${current%-${TAG_SUFFIX}}"

              if [ -n "$latest" ] && [ "$latest" != "$current" ]; then
                selected+=("$v")
                echo "build $v (latest=$latest, current=${current:-none})"
              else
                echo "skip $v (latest=${latest:-none}, current=${current:-none})"
              fi
            done
          fi

          if [ "${#selected[@]}" -eq 0 ]; then
            matrix='[]'
          else
            matrix=$(printf '%s\n' "${selected[@]}" | jq -R . | jq -c -s .)
          fi

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Selected: $matrix"

  build:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Fetch all history including tags

      - name: Load variant config
        run: |
          . "variants/${{ matrix.variant }}.env"
          {
            echo "VARIANT=${{ matrix.variant }}"
            for k in NAME BRAND TAG_SUFFIX CLI_JAR PATCHES_SCRIPT PATCHES_GLOB \
                     PATCH_FLAG PATCHES_REPO KEYSTORE_NAME KEYSTORE_GLOB; do
              printf '%s=%s\n' "$k" "${!k}"
            done
          } >> "$GITHUB_ENV"

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Make scripts executable
        run: chmod +x *.sh

      - name: Get latest ${{ env.BRAND }} CLI version
        id: get-latest-cli-version
        run: |
          VERSION=$(./get-latest-cli.sh --version-only)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Cache ${{ env.BRAND }} CLI
        id: cache-cli
        uses: actions/cache@v6
        with:
          path: ${{ env.CLI_JAR }}
          key: ${{ env.TAG_SUFFIX }}-cli-${{ steps.get-latest-cli-version.outputs.version }}

      - name: Download ${{ env.BRAND }} CLI
        if: steps.cache-cli.outputs.cache-hit != 'true'
        run: |
          # A prefix-matched cache restore can leave a stale jar behind while
          # cache-hit is still false; drop it so $CLI_JAR never matches two files.
          rm -f $CLI_JAR
          VERSION=$(./get-latest-cli.sh)
          echo "Downloaded CLI version: $VERSION"

      - name: Get Dev Patches version
        id: get-dev-patches-version
        run: |
          VERSION=$(./$PATCHES_SCRIPT --version-only)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Cache ${{ env.BRAND }} Patches
        id: cache-patches
        uses: actions/cache@v6
        with:
          path: ${{ env.PATCHES_GLOB }}
          key: ${{ env.TAG_SUFFIX }}-patches-${{ steps.get-dev-patches-version.outputs.version }}

      - name: Download ${{ env.BRAND }} Patches
        if: steps.cache-patches.outputs.cache-hit != 'true'
        run: |
          # Same stale-restore guard as the CLI step: never keep two bundles.
          rm -f $PATCHES_GLOB
          VERSION=$(./$PATCHES_SCRIPT)
          echo "Downloaded patches version: $VERSION"

      - name: Get APKMirror Downloader version
        id: get-apkmd-version
        run: |
          VERSION=$(./get-apkmd.sh --version-only)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Cache APKMirror Downloader
        id: cache-apkmd
        uses: actions/cache@v6
        with:
          path: apkmd
          key: apkmd-${{ steps.get-apkmd-version.outputs.version }}

      - name: Download APKMirror Downloader
        if: steps.cache-apkmd.outputs.cache-hit != 'true'
        run: |
          VERSION=$(./get-apkmd.sh)
          echo "Downloaded APKMirror Downloader version: $VERSION"

      - name: Determine YT Version
        id: yt-version
        run: |
          VERSION=$(./fetch-yt-ver.sh)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get last release tag and extract patch version
        id: get-last-patch
        run: |
          latest_version=$(./$PATCHES_SCRIPT --version-only || true)
          current_tag=$(git tag -l "*-${TAG_SUFFIX}" --sort=-version:refname | head -n1 || true)

          # Strip -<suffix> before comparing so v1.x.x-dev.8 == v1.x.x-dev.8-revanced
          # If equal, fallback to previous tag
          if [ -n "$latest_version" ] && [ "$latest_version" = "${current_tag%-${TAG_SUFFIX}}" ]; then
            current_tag=$(git tag -l "*-${TAG_SUFFIX}" --sort=-version:refname | sed -n '2p' || true)
          fi

          # Defaults
          if [ -z "$latest_version" ]; then latest_version="none"; fi
          if [ -z "$current_tag" ]; then current_tag="none"; fi

          {
            echo "latest_version=$latest_version"
            echo "current_tag=$current_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Generate changelog URL
        id: generate-changelog
        run: |
          current_tag="${{ steps.get-last-patch.outputs.current_tag }}"
          latest_version="${{ steps.get-last-patch.outputs.latest_version }}"

          # Strip -<suffix> so the URL uses the actual patches tag
          current_tag_clean="${current_tag%-${TAG_SUFFIX}}"

          if [[ "$latest_version" != "none" && "$latest_version" != "$current_tag_clean" ]]; then
            CHANGELOG_URL="https://github.com/${PATCHES_REPO}/compare/${current_tag_clean}...${latest_version}"
            echo "url=$CHANGELOG_URL" >> $GITHUB_OUTPUT
            echo "has_changelog=true" >> $GITHUB_OUTPUT
          else
            echo "has_changelog=false" >> $GITHUB_OUTPUT
          fi

      - name: Install curl_cffi (Cloudflare bypass for APKMirror)
        run: python3 -m pip install --user -q curl_cffi

      - name: Cache YT APK
        id: cache-apk
        uses: actions/cache@v6
        with:
          path: ${{ env.DOWNLOADS_DIR }}/yt-${{ steps.yt-version.outputs.version }}.apk
          key: ${{ steps.yt-version.outputs.version }}

      - name: Download YT APK
        if: steps.cache-apk.outputs.cache-hit != 'true'
        run: |
          VERSION="${{ steps.yt-version.outputs.version }}"
          # Download universal APK
          cat <<EOF > apps.json
          {
            "options": {
              "arch": "${{ env.ARCH }}",
              "fallbackArch": "arm64-v8a",
              "outDir": "${{ env.DOWNLOADS_DIR }}"
            },
            "apps": [
              {
                "org": "google-inc",
                "repo": "youtube",
                "outFile": "yt-${VERSION}",
                "version": "$VERSION"
              }
            ]
          }
          EOF
          ./apkmd apps.json

      - name: Cache ${{ env.BRAND }} keystore
        id: cache-keystore
        uses: actions/cache@v6
        with:
          path: ${{ env.KEYSTORE_NAME }}
          key: ${{ env.KEYSTORE_NAME }}

      - name: Set output filename
        id: set-filename
        run: |
          FILENAME="${NAME}_${{ steps.yt-version.outputs.version }}_${{ steps.get-dev-patches-version.outputs.version }}-patched.apk"
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT

      - name: Download keystore from latest release
        id: download-keystore
        if: steps.cache-keystore.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          ./get-keystore.sh "${{ github.repository }}" "${{ env.KEYSTORE_NAME }}"
          echo "keystore_found=true" >> $GITHUB_OUTPUT

      - name: Patch YT APK and generate keystore
        if: steps.cache-keystore.outputs.cache-hit != 'true' && steps.download-keystore.outputs.keystore_found != 'true'
        run: |
            java -jar $CLI_JAR patch $PATCH_FLAG $PATCHES_GLOB ${{ env.DOWNLOADS_DIR }}/yt-*.apk -o "${{ steps.set-filename.outputs.filename }}"
            mv $KEYSTORE_GLOB ${{ env.KEYSTORE_NAME }}

      - name: Patch YT APK with existing keystore
        if: steps.cache-keystore.outputs.cache-hit == 'true' || steps.download-keystore.outputs.keystore_found == 'true'
        run: |
            java -jar $CLI_JAR patch $PATCH_FLAG $PATCHES_GLOB ${{ env.DOWNLOADS_DIR }}/yt-*.apk --keystore ${{ env.KEYSTORE_NAME }} -o "${{ steps.set-filename.outputs.filename }}"

      - name: Generate APKmirror url
        id: generate-apkmirror-url
        run: |
          # Set the version
          version=${{ steps.yt-version.outputs.version }}

          # Replace dots with dashes
          version_dash="${version//./-}"

          # Construct the URL
          URL="https://www.apkmirror.com/apk/google-inc/youtube/youtube-${version_dash}-release/youtube-${version_dash}-2-android-apk-download/#safeDownload"

          # Output the URL
          echo "$URL"
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Generate build information
        run: |
          YT_VERSION="${{ steps.yt-version.outputs.version }}"
          CLI_VERSION="${{ steps.get-latest-cli-version.outputs.version }}"
          PATCHES_VERSION="${{ steps.get-dev-patches-version.outputs.version }}"
          URL="${{ steps.generate-apkmirror-url.outputs.url }}"
          FILENAME="${{ steps.set-filename.outputs.filename }}"
          ORIGINAL_APK="${{ env.DOWNLOADS_DIR }}/yt-${YT_VERSION}.apk"
          HAS_CHANGELOG="${{ steps.generate-changelog.outputs.has_changelog }}"
          CHANGELOG_URL="${{ steps.generate-changelog.outputs.url }}"
          DL_URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.get-dev-patches-version.outputs.version }}-${{ env.TAG_SUFFIX }}/${FILENAME}"

          # Generate changelog section if available
          CHANGELOG_SECTION=""
          if [[ "$HAS_CHANGELOG" == "true" ]]; then
            CHANGELOG_SECTION="
          - **📝 Changelog**: [\`$(basename "$CHANGELOG_URL")\`]($CHANGELOG_URL)"
          fi

          cat <<EOF > yt-${TAG_SUFFIX}-info.md
          ## 💡 ${NAME} Build Information

          - **📺 YT Version**: \`${YT_VERSION}\` [SHA-256]($URL)
          - **📦 APK Filename**: \`${FILENAME}\`
          - **🧩 ${BRAND} Patches Version**: \`${PATCHES_VERSION}\`$CHANGELOG_SECTION
          - **🔨 ${BRAND} CLI Version**: \`${CLI_VERSION}\`
          - **📅 Build Date**: \`$(TZ=${{ env.TIMEZONE }} date +%Y-%m-%d)\` \`$(TZ=${{ env.TIMEZONE }} date +%H:%M:%S%:z)\`

          -----
          ### 🔐 APK file hashes

          | Filename                        | SHA-256 Checksum                                    |
          |:--------------------------------|:----------------------------------------------------|
          | [${FILENAME}](${DL_URL})        | \`$(sha256sum ${FILENAME} | awk '{print $1}')\`     |
          | yt-${YT_VERSION}.apk (original) | \`$(sha256sum ${ORIGINAL_APK} | awk '{print $1}')\` |
          EOF

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: "📺 ${{ env.NAME }} ${{ steps.yt-version.outputs.version }} | 🧩 ${{ steps.get-dev-patches-version.outputs.version }}"
          tag_name: ${{ steps.get-dev-patches-version.outputs.version }}-${{ env.TAG_SUFFIX }}
          body_path: yt-${{ env.TAG_SUFFIX }}-info.md
          files: |
            *.apk
            *.keystore
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # After a successful build, point the README release badges at each
  # variant's latest release tag (releases/latest only knows one "latest").
  update-readme:
    needs: [plan, build]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Need tags to resolve each variant's latest release

      - name: Update latest-release links in README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for s in revanced morphe; do
            tag=$(git tag -l "*-${s}" --sort=-version:refname | head -n1)
            [ -z "$tag" ] && continue
            url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"
            sed -i -E "s|^\[release-${s}-url\]:.*|[release-${s}-url]: ${url}|" .github/README.md
            echo "$s -> $tag"
          done

          git add .github/README.md
          if git diff --cached --quiet; then
            echo "Links already up to date"
            exit 0
          fi

          git commit -m "docs: point badge links at each variant's latest release"

          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep 5
          done
          exit 1
